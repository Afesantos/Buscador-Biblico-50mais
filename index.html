<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador bíblico Ministério 50+</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary-color: #2c5f9e; --bg-color: #f4f6f9; --base-size: 1.125rem; }
        
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); padding: 20px; padding-bottom: 60vh; }
        
        .container { width: 100%; max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        h1 { color: var(--primary-color); text-align: center; font-size: 2rem; margin-bottom: 25px; }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        select { flex: 2; min-width: 250px; padding: 12px; border-radius: 6px; border: 1px solid #ccc; }
        input { flex: 3; padding: 12px; border: 1px solid #ccc; border-radius: 6px; }
        .btn-search { padding: 12px 25px; background: var(--primary-color); color: white; border: none; border-radius: 6px; cursor: pointer; }

        .actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        .font-controls button { 
            padding: 8px 15px; background: #e2e8f0; border: none; border-radius: 4px; 
            cursor: pointer; font-weight: bold; color: #333; margin-left: 5px; 
        }

        .verse-item { 
            font-family: 'Merriweather', serif; 
            font-weight: 300; 
            font-size: var(--base-size); 
            line-height: 1.4; 
            color: #1e293b; 
            margin-bottom: 0.8em; 
            padding: 12px; 
            border-left: 4px solid var(--primary-color); 
            background: linear-gradient(to right, #ffffff, #cbd5e1); 
            border-radius: 0 8px 8px 0; 
        }

        .verse-number { font-weight: 600; color: var(--primary-color); margin-right: 8px; font-size: 0.8em; vertical-align: super; }
        h2 { color: var(--primary-color); font-family: 'Segoe UI', sans-serif; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Buscador bíblico Ministério 50+</h1>
    
    <div class="search-box">
        <select id="versionSelect">
            <option value="pt_acf">Almeida Corrigida Fiel (ACF)</option>
            <option value="pt_nvi">Nova Versão Internacional (NVI)</option>
            <option value="pt_aa">Almeida Revisada (AA)</option>
        </select>
        <input type="text" id="searchInput" placeholder="Ex: Jo 3:16, Gn 1:1-3 ou apo 19">
        <button class="btn-search" onclick="buscarTexto()">Buscar</button>
    </div>

    <div class="actions">
        <span></span> 
        <div class="font-controls">
            <button onclick="mudarFonte(-0.1)">A-</button>
            <button onclick="mudarFonte(0.1)">A+</button>
        </div>
    </div>

    <div id="results"></div>
</div>

<script>
    const bibleCache = {};
    let currentSize = 1.125;

    function mudarFonte(delta) {
        currentSize += delta;
        document.documentElement.style.setProperty('--base-size', currentSize + 'rem');
    }

    document.getElementById('searchInput').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            buscarTexto();
        }
    });

    function removerAcentos(str) {
        return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function resolverNomeLivro(input) {
        const map = {
            "gn": "Gênesis", "ex": "Êxodo", "lv": "Levítico", "nm": "Números", "dt": "Deuteronômio", "js": "Josué",
            "jz": "Juízes", "rt": "Rute", "1sm": "1 Samuel", "2sm": "2 Samuel", "1rs": "1 Reis", "2rs": "2 Reis",
            "1cr": "1 Crônicas", "2cr": "2 Crônicas", "ed": "Esdras", "ne": "Neemias", "et": "Ester", "job": "Jó",
            "sl": "Salmos", "pv": "Provérbios", "ec": "Eclesiastes", "ct": "Cânticos", "is": "Isaías", "jr": "Jeremias",
            "lm": "Lamentações", "ez": "Ezequiel", "dn": "Daniel", "os": "Oséias", "jl": "Joel", "am": "Amós",
            "ob": "Obadias", "jn": "Jonas", "mq": "Miquéias", "na": "Naum", "hc": "Habacuque", "sf": "Sofonias",
            "ag": "Ageu", "zc": "Zacarias", "ml": "Malaquias", "mt": "Mateus", "mc": "Marcos", "lc": "Lucas",
            "jo": "João", "at": "Atos", "rm": "Romanos", "1co": "1 Coríntios", "2co": "2 Coríntios", "gl": "Gálatas",
            "ef": "Efésios", "fp": "Filipenses", "cl": "Colossenses", "1ts": "1 Tessalonicenses", "2ts": "2 Tessalonicenses",
            "1tm": "1 Timóteo", "2tm": "2 Timóteo", "tt": "Tito", "fm": "Filemom", "hb": "Hebreus", "tg": "Tiago",
            "1pe": "1 Pedro", "2pe": "2 Pedro", "1jo": "1 João", "2jo": "2 João", "3jo": "3 João", "jd": "Judas", "ap": "Apocalipse"
        };
        const key = input.toLowerCase().replace(/\s/g, "");
        return map[key] || input.charAt(0).toUpperCase() + input.slice(1);
    }

    async function buscarTexto() {
        const query = document.getElementById('searchInput').value.trim();
        const match = query.match(/^([a-zA-Z0-9\s]+?)\s+(\d+)(?:\s*:\s*(\d+)(?:\s*-\s*(\d+))?)?$/);
        
        if (!match) { alert("Formato inválido. Use: Livro Capítulo:Verso-Verso"); return; }

        const nomeBuscaOriginal = match[1].trim();
        const nomeBuscaSanitizado = removerAcentos(nomeBuscaOriginal.toLowerCase());
        const nomeLivroResolvido = resolverNomeLivro(nomeBuscaOriginal);

        const cap = parseInt(match[2]);
        const start = match[3] ? parseInt(match[3]) : null;
        const end = match[4] ? parseInt(match[4]) : start;

        const select = document.getElementById('versionSelect');
        const versao = select.value;
        const nomeVersao = select.options[select.selectedIndex].text;
        
        const data = await fetchBible(versao);
        
        const livro = data.find(b => {
            const nameNormalizado = removerAcentos((b.name || "").toLowerCase());
            const bookNormalizado = removerAcentos((b.book || "").toLowerCase());
            const abbrevNormalizado = removerAcentos((b.abbrev || "").toLowerCase());

            // 1. Verifica pelo nome exato (resolvido ou do JSON)
            if (nameNormalizado === nomeBuscaSanitizado || bookNormalizado === nomeBuscaSanitizado) return true;
            if (nameNormalizado === removerAcentos(nomeLivroResolvido.toLowerCase())) return true;
            
            // 2. Verifica pelas siglas oficiais
            if (abbrevNormalizado === nomeBuscaSanitizado) return true;

            // 3. Verifica pelas 3 (ou mais) primeiras letras
            // Ex: "apo" vai bater com "apocalipse"
            if (nomeBuscaSanitizado.length >= 3 && (nameNormalizado.startsWith(nomeBuscaSanitizado) || bookNormalizado.startsWith(nomeBuscaSanitizado))) {
                return true;
            }

            return false;
        });
        
        if (!livro || !livro.chapters[cap - 1]) { alert("Livro ou capítulo não encontrado."); return; }

        const versiculos = livro.chapters[cap - 1];
        let refTitle = `${livro.name || livro.book} ${cap}`;
        if (start) refTitle += start === end ? `:${start}` : `:${start}-${end}`;
        
        let html = `<h2>${refTitle} - ${nomeVersao}</h2>`;
        
        const lista = start ? versiculos.slice(start - 1, end) : versiculos;
        lista.forEach((t, i) => {
            html += `<div class="verse-item"><span class="verse-number">${start ? (start + i) : (i + 1)}</span>${t}</div>`;
        });
        
        document.getElementById('results').innerHTML = html;
    }

    async function fetchBible(v) {
        if (bibleCache[v]) return bibleCache[v];
        const res = await fetch(`https://raw.githubusercontent.com/thiagobodruk/bible/master/json/${v}.json`);
        return bibleCache[v] = await res.json();
    }

    document.getElementById('versionSelect').addEventListener('change', () => {
        if(document.getElementById('searchInput').value) buscarTexto();
    });
</script>
</body>
</html>
